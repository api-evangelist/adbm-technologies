aid: adbm-technologies
name: AdBm Technologies
description: 'AdBm Technologies is an Austin, Texas acoustical engineering company that
  designs and manufactures near-pile underwater noise mitigation systems for offshore
  wind construction. Its injection-molded HDPE Helmholtz resonators, mounted on an expandable
  steel framework and paired with an integrated bubble curtain, absorb and disperse the
  low-frequency sound energy generated during pile driving so contractors can meet
  underwater noise regulations while protecting marine life. The technology grew out of
  more than a decade of research at the University of Texas at Austin Applied Research
  Laboratories and has been deployed on offshore wind projects from the North Sea to the
  Atlantic coast of the United States. The company sells and leases hardware and project
  services; it publishes no public API, developer program, or machine-readable contract.'
